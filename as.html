<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><script>/* ==== Bus común de la suite (DION · A.S. · M.E.Z.) ====
   Todas las páginas de la suite comparten el mismo origen, así que comparten
   localStorage. Cada herramienta escribe solo "su" parte y escucha el evento
   `storage` para aplicar lo que cambian las demás, al instante.
   Partes: terreno (DION) · zonas (M.E.Z.) · zonasMove (A.S. → M.E.Z.)
           tiempo (A.S.) · clima (A.S.) */
(function(){
  const KEY='NHIG_BUS_V1';
  const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
  const last={};
  const Bus={
    KEY,
    read(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } },
    get(part){ return Bus.read()[part]; },
    write(part,val,from){
      const js=JSON.stringify(val); const h=hash(js);
      const cur=Bus.read(); if(cur[part]!==undefined && hash(JSON.stringify(cur[part]))===h) return false;
      cur[part]=val; cur._meta=cur._meta||{}; cur._meta[part]={from,t:Date.now()};
      last[part]=h;
      try{ localStorage.setItem(KEY,JSON.stringify(cur)); }catch(e){ return false; }
      try{ if(window.parent&&window.parent!==window) window.parent.postMessage({nhig:'bus',part,from},'*'); }catch(e){}
      return true;
    },
    changed(part){ const v=Bus.read()[part]; if(v===undefined) return null; const h=hash(JSON.stringify(v)); if(last[part]===h) return null; last[part]=h; return v; },
    seen(part){ const v=Bus.read()[part]; if(v!==undefined) last[part]=hash(JSON.stringify(v)); },
    on(fn){ window.addEventListener('storage',e=>{ if(e.key===KEY) fn(Bus.read()); }); }
  };
  window.NHIG_BUS=Bus;
  // Las páginas dentro de la suite usan las capacidades (descargas) de la página principal.
  // Descargas desde las herramientas: las guarda la página principal de la suite (la que tiene el permiso).
  if(window.parent!==window){
    let n=0; const wait={};
    window.addEventListener('message',e=>{ const d=e.data; if(d&&d.nhig==='saved'&&wait[d.id]){ const w=wait[d.id]; delete wait[d.id]; d.ok?w[0](true):w[1](Object.assign(new Error(d.msg||'no'),{code:d.code})); } });
    const save=o=>new Promise((res,rej)=>{ const id='s'+(++n)+Date.now(); wait[id]=[res,rej]; window.parent.postMessage({nhig:'save',id,filename:o.filename,data:o.data},'*'); });
    const dl={save};
    const real=(()=>{ try{ return window.parent.claude||null; }catch(e){ return null; } })();
    window.claude={ use:async name=>{ if(name==='downloads') return dl; const r=(()=>{ try{ return window.parent.claude; }catch(e){ return null; } })(); if(r&&r.use) return r.use(name); throw Object.assign(new Error('no disponible'),{code:'unavailable'}); } };
  }
})();
</script>
<title>A.S. Análisis de Sitio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* A.S. — Análisis de Sitio. Lenguaje visual de DION: fondo #03060B, vidrio oscuro,
   acento cian, lima para hecho/activo, rojo solo para alertas.
   Michroma (títulos) · Chakra Petch (cuerpo) · JetBrains Mono (números). */
:root{color-scheme:dark;
  --bg:#03060B;--bg2:#08101A;--panel:#0A131F;--panel2:#0E1928;--glass:rgba(8,16,26,.84);
  --line:rgba(120,200,255,.14);--line2:rgba(120,200,255,.3);--grid:rgba(120,200,255,.045);
  --ink:#E4EEFA;--muted:#8CA0B6;--faint:#55677C;
  --acc:#38E1FF;--acc-rgb:56,225,255;--done:#B6FF3C;--done-rgb:182,255,60;--warn:#FF5C7A;--warn-rgb:255,92,122;
  --glow:0 0 0 1px rgba(var(--acc-rgb),.35),0 0 16px -4px rgba(var(--acc-rgb),.5);
  --f-d:"Michroma","Eurostile","Arial Black",system-ui,sans-serif;
  --f-b:"Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --hdr:56px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-b);font-size:13px;color:var(--ink);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:42px 42px,42px 42px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;color-scheme:dark;min-width:0}
input[type=number],input[type=text]{font-family:var(--f-m);font-size:12px}
select option{background:var(--panel)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.14)}
input[type=range]{padding:0;border:none;background:transparent;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(var(--acc-rgb),.28);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:rgba(var(--acc-rgb),.5)}
.mono{font-family:var(--f-m)}
svg.ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Botones: píldora con borde fino (DION) ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.02em;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid var(--line2);color:var(--ink);white-space:nowrap;transition:box-shadow .15s,border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--acc);box-shadow:0 0 14px rgba(var(--acc-rgb),.25)}
.btn:active{background:rgba(var(--acc-rgb),.1)}
.btn.pri{background:rgba(var(--acc-rgb),.12);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.pri:hover{background:var(--acc);color:#021016}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--acc)}
.btn.dan{background:rgba(var(--warn-rgb),.08);border-color:rgba(var(--warn-rgb),.55);color:#FF9DB0}
.btn.dan:hover{border-color:var(--warn);box-shadow:0 0 14px rgba(var(--warn-rgb),.3);color:#FFD3DC}
.btn.on{background:rgba(var(--done-rgb),.14)!important;border-color:var(--done)!important;color:var(--done)!important}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:4px 10px;font-size:11px}
.btn.icon{padding:0;width:34px;height:34px;justify-content:center;border-radius:999px}

/* ---------- Cabecera ---------- */
header.hdr{position:relative;z-index:50;height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--glass);border-bottom:1px solid var(--line2)}
header.hdr::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:var(--acc);box-shadow:0 0 10px rgba(var(--acc-rgb),.6)}
.logo{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.08);flex-shrink:0}
.logo svg{width:19px;height:19px}
.ttl h1{margin:0;font-family:var(--f-d);font-weight:400;font-size:14px;letter-spacing:.24em;color:var(--ink)}
.ttl .sub{font-family:var(--f-m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.badge{font-family:var(--f-m);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:rgba(var(--done-rgb),.08);color:var(--done);border:1px solid rgba(var(--done-rgb),.4);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
#hdrActions{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#hdrActions::-webkit-scrollbar{display:none}
/* En pantallas angostas cada botón se minimiza a su ícono; nada desaparece. */
@media (max-width:1440px){
  #hdrActions .btn.col:not(.keep){width:34px;height:34px;min-width:34px;padding:0;justify-content:center;border-radius:999px}
  #hdrActions .btn.col:not(.keep)>span{display:none}
}
@media (max-width:1100px){
  #hdrActions .btn.col{width:34px;height:34px;min-width:34px;padding:0;justify-content:center;border-radius:999px}
  #hdrActions .btn.col>span{display:none}
  .ttl .sub{display:none}
}
@media (max-width:560px){ .badge{display:none} .ttl h1{font-size:12px;letter-spacing:.18em} }

/* ---------- Navegación de secciones ---------- */
nav#secNav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:rgba(3,6,11,.92);scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip .n{font-family:var(--f-m);font-size:10px;opacity:.75}
.chip:hover{color:var(--ink);border-color:var(--acc)}
.chip.act{background:rgba(var(--acc-rgb),.12);border-color:var(--acc);color:var(--acc);box-shadow:0 0 14px rgba(var(--acc-rgb),.25)}
.chip.lock{opacity:.4;cursor:default}
.chip.lock:hover{border-color:var(--line);color:var(--muted)}
.chip-sep{width:1px;background:var(--line2);margin:2px 4px;flex-shrink:0}

/* ---------- Área de trabajo ---------- */
#work{position:absolute;top:calc(var(--hdr) + 47px);left:0;right:0;bottom:0;display:flex}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;border-right:1px solid var(--line)}
#cv2d,#v3d{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#v3d{display:none}
#v3d canvas{display:block;width:100%;height:100%;touch-action:none}
.hud::before,.hud::after{content:"";position:absolute;width:16px;height:16px;border:solid var(--acc);opacity:.8;pointer-events:none;z-index:3}
.hud::before{top:6px;left:6px;border-width:2px 0 0 2px}.hud::after{bottom:6px;right:6px;border-width:0 2px 2px 0}
#panel{width:380px;flex-shrink:0;overflow-y:auto;background:rgba(6,12,20,.94);padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
#panel.hide{display:none}
@media (orientation:portrait) and (max-width:1100px),(max-width:700px){
  #work{flex-direction:column}
  #stage{flex:none;height:60%;border-right:none;border-bottom:1px solid var(--line)}
  #panel{width:auto;flex:1;padding-bottom:40px}
  #work.panelHidden #stage{height:100%}
}
@media (orientation:landscape) and (max-height:520px){
  :root{--hdr:46px}
  #panel{width:300px}
  nav#secNav{padding:5px 10px}
  .chip{padding:3px 9px}
  .logo{width:30px;height:30px}
}
@media (max-width:640px),(max-height:520px){
  #sunLbl{display:none}
  #timeLbl{min-width:0;font-size:11px}
  #tMonth{width:84px}
  #tPreset{width:84px}
  #timeBar{padding:4px 6px;gap:4px}
  #timeBar .tb-body{gap:4px}
  #timeBar .btn.icon{width:30px;height:30px}
}
@media (max-width:560px){
  #hdrActions{gap:4px}
  #hdrActions .btn,#hdrActions .btn.col{width:30px;height:30px;min-width:30px;padding:0;justify-content:center;border-radius:999px}
  header.hdr{gap:8px;padding:0 8px}
  #hdrActions .btn>span{display:none}
}
/* Barras flotantes sobre el lienzo: vidrio oscuro sin desenfoque (más fluido) */
.float{position:absolute;z-index:5;display:flex;gap:5px;align-items:center}
.glass{background:var(--glass);border:1px solid var(--line2);border-radius:12px}
.glass::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border:2px solid var(--acc);border-right:0;border-bottom:0;border-top-left-radius:12px;pointer-events:none}
#viewSw{top:10px;left:10px;padding:3px}
#zoomBar{top:10px;right:10px;padding:3px}
#toolBar{top:56px;left:10px;flex-direction:column;padding:4px;max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none}
#toolBar::-webkit-scrollbar{display:none}
#toolBar .grp{display:flex;flex-direction:column;gap:4px}
#toolBar .tgl{font-family:var(--f-m);font-size:9px;color:var(--faint);text-align:center;cursor:pointer;padding:2px 0;user-select:none}
#toolBar.min .grp{display:none}
#timeBar{left:10px;right:10px;bottom:10px;padding:6px 8px;flex-wrap:wrap;gap:6px}
#timeBar.min .tb-body{display:none}
#timeBar .tb-body{display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;min-width:0}
#timeBar input[type=range]{flex:1;min-width:120px}
#timeLbl{font-family:var(--f-m);font-size:12px;min-width:118px;color:var(--acc)}
#sunLbl{font-family:var(--f-m);font-size:11px;color:var(--muted)}
#tip{position:absolute;z-index:8;pointer-events:none;display:none;max-width:240px;padding:7px 9px;font-size:11.5px;line-height:1.45;border-radius:10px;
  background:rgba(3,6,11,.95);border:1px solid var(--line2);box-shadow:0 8px 30px -8px #000}
#tip b{color:var(--acc);font-weight:600}
#drawHint{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:10px;padding:5px 10px;font-size:11.5px;display:none}
#drawHint .btn{margin-left:6px}
.emptyMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.emptyMsg div{position:relative;max-width:340px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5;padding:14px 16px;pointer-events:auto}

/* ---------- Panel ---------- */
.ph{display:flex;align-items:center;gap:8px;margin:2px 0 12px;color:var(--acc)}
.ph h2{margin:0;font-family:var(--f-d);font-weight:400;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.ph .q{font-size:11.5px;color:var(--muted)}
details.box{position:relative;border:1px solid var(--line2);border-radius:12px;background:var(--glass);margin-bottom:9px}
details.box::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border:2px solid var(--acc);border-right:0;border-bottom:0;border-top-left-radius:12px;pointer-events:none}
details.box>summary{list-style:none;cursor:pointer;padding:9px 10px;font-family:var(--f-d);font-weight:400;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:7px;user-select:none}
details.box>summary svg.ic{color:var(--acc)}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"▾";margin-left:auto;color:var(--faint);transition:transform .15s;font-family:var(--f-b);letter-spacing:0}
details.box:not([open])>summary::after{transform:rotate(-90deg)}
details.box>.bd{padding:2px 10px 10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
.row label{font-size:11px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:3px;flex:1;min-width:90px}
.fld>span{font-size:9.5px;color:var(--faint);font-family:var(--f-m);text-transform:uppercase;letter-spacing:.12em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--f-m);text-align:right}
.note{font-size:11.5px;color:var(--muted);line-height:1.45}
.warn{font-size:11.5px;color:#FFC2CE;background:rgba(var(--warn-rgb),.08);border:1px solid rgba(var(--warn-rgb),.45);border-radius:9px;padding:6px 8px;line-height:1.45}
.concl{margin:0;padding-left:16px;font-size:12px;line-height:1.5}
.concl li{margin:3px 0}
.concl li::marker{color:var(--acc)}
.legend{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-family:var(--f-m)}
.legend .bar{flex:1;height:9px;border-radius:5px}
canvas.chart{width:100%;display:block;border-radius:10px;background:rgba(3,6,11,.6);border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:11px;font-family:var(--f-m)}
table.t th,table.t td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:500}
.list-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-size:12px}
.list-item:hover{border-color:var(--line2)}
.list-item.sel{border-color:var(--acc);background:rgba(var(--acc-rgb),.1)}
.list-item .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.list-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-family:var(--f-m);font-size:10px;padding:1px 7px;border-radius:999px;background:transparent;border:1px solid var(--line2);color:var(--muted)}
.pill.ok{border-color:rgba(var(--done-rgb),.5);color:var(--done)}
.src{font-family:var(--f-m);font-size:10px;color:var(--faint);margin-top:6px}
.mzTag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--done);border:1px solid rgba(var(--done-rgb),.45);border-radius:999px;padding:1px 8px}

/* ---------- Modal y aviso ---------- */
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:14px}
#modal .card{position:relative;width:100%;max-width:520px;max-height:90vh;overflow:auto;background:rgba(8,16,26,.97);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;box-shadow:0 20px 60px -10px #000}
#modal .card::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border:2px solid var(--acc);border-right:0;border-bottom:0;border-top-left-radius:12px;pointer-events:none}
#modal h3{margin:0 0 10px;font-family:var(--f-d);font-weight:400;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
#modal h3 svg.ic{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(120px);z-index:120;padding:9px 16px;border-radius:8px;font-size:12.5px;
  background:var(--panel2);border:1px solid var(--acc);box-shadow:0 0 24px rgba(var(--acc-rgb),.35);transition:transform .25s}
#toast.show{transform:translateX(-50%) translateY(0)}
#secView{position:absolute;left:10px;right:10px;z-index:7;height:46%;min-height:220px;display:flex;flex-direction:column;overflow:hidden}
#secView[hidden]{display:none!important}
#secHead{display:flex;align-items:center;gap:5px;padding:5px 6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#secHead::-webkit-scrollbar{display:none}
#secHead select{max-width:200px;font-size:12px;padding:3px 6px}
#secCv{flex:1;width:100%;min-height:0;display:block}
@media (max-width:640px){#secHead .btn>span{display:none} #secView{height:52%}}
#faceTip{position:absolute;z-index:9;width:300px;max-width:calc(100% - 12px);padding:9px 10px;font-size:12px}
#faceTip[hidden]{display:none!important}
details.guide{background:rgba(var(--acc-rgb),.05);border-color:rgba(var(--acc-rgb),.35)}
#busy{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#busy div{padding:12px 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--acc);font-family:var(--f-m);font-size:12px;color:var(--acc)}
</style>

<header class="hdr">
  <div class="logo" title="A.S. · Análisis de Sitio"><i data-i="compass"></i></div>
  <div class="ttl">
    <div style="display:flex;align-items:center;gap:8px"><h1>A.S.</h1><span class="badge" id="projBadge">Proyecto</span></div>
    <div class="sub">Análisis de Sitio · Sol · Sombras · Viento · Temperatura · 2D / 3D</div>

let DION_P = null; try { DION_P = DIONB && DIONB.project ? DIONB.project() : null; } catch (e) { DION_P = null; }
let STORE_KEY = "AS_SITIO_V1", STORE_BG = "AS_SITIO_V1_BG", STORE_CLIMA = "AS_SITIO_V1_CLIMA";
function setStoreKeys(pid) { const k = pid ? "@" + pid : ""; STORE_KEY = "AS_SITIO_V1" + k; STORE_BG = "AS_SITIO_V1_BG" + k; STORE_CLIMA = "AS_SITIO_V1_CLIMA" + k; }
setStoreKeys(DION_P && DION_P.id);
const PROFILES = { aeropuerto: "Aeropuerto", vivienda: "Vivienda", hospital: "Hospital / salud", hotel: "Hotel", educacion: "Educación", oficinas: "Oficinas / comercio", equipamiento: "Equipamiento", urbanismo: "Urbanismo", otro: "Otro" };

function blankState() {
  const now = new Date();
  return {

function mergeState(o) {

// ---------- Deshacer / Rehacer (geometría) ----------
const UNDO = [], REDO = [];
function snap() { return JSON.stringify({ lot: S.lot, vols: S.vols, trees: S.trees, pts: S.pts, bg: S.bg, cad: S.cad, cadLayers: S.cadLayers, overhangs: S.overhangs, sections: S.sections, streets: S.streets }); }
function pushUndo() { UNDO.push(snap()); if (UNDO.length > 80) UNDO.shift(); REDO.length = 0; }
function applySnap(j) { const o = JSON.parse(j); Object.assign(S, o); invalidate(); render(); renderPanel(); saveLocal(); }
function undo() { if (!UNDO.length) return toast("Nada que deshacer"); REDO.push(snap()); applySnap(UNDO.pop()); }
function redo() { if (!REDO.length) return toast("Nada que rehacer"); UNDO.push(snap()); applySnap(REDO.pop()); }

// ---------- Posición solar (NOAA) ----------
// hour = hora local estándar (sin horario de verano), tz = desfase UTC en horas.
function solarCore(doy, hour) {
  const g = 2 * Math.PI / 365 * (doy - 1 + (hour - 12) / 24);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  return { eqt, decl };
}
function sunPos(doy, hour, site) {
  site = site || S.site;
  const { eqt, decl } = solarCore(doy, hour);
  const lat = site.lat * D2R;
  const tst = hour * 60 + eqt + 4 * site.lon - 60 * site.tz;
  const ha = (tst / 4 - 180) * D2R;
  let cz = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha);
  cz = clamp(cz, -1, 1);
  const zen = Math.acos(cz);
  let az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(lat) - Math.tan(decl) * Math.cos(lat)) * R2D + 180;
  az = (az + 360) % 360;
  return { alt: 90 - zen * R2D, az, decl: decl * R2D };
}
function sunTimes(doy, site) {
  site = site || S.site;
  const { eqt, decl } = solarCore(doy, 12);
  const lat = site.lat * D2R;
  const c = Math.cos(90.833 * D2R) / (Math.cos(lat) * Math.cos(decl)) - Math.tan(lat) * Math.tan(decl);
  const noon = (720 - 4 * site.lon - eqt + site.tz * 60) / 60;
  if (c > 1) return { rise: null, set: null, noon, len: 0, polar: "noche" };

function triggerDownload(data, filename) {

let RWY_CACHE = {};
function runwayCoverage(H, lim) {
  const c = S.climate; if (!c) return 0; const key = H + "|" + lim + "|" + c.label + c.T.length; if (RWY_CACHE[key] != null) return RWY_CACHE[key];
  let ok = 0, tot = 0; const lm = lim / 1.94384;
  for (let k = 0; k < c.WS.length; k++) { const ws = c.WS[k], wd = c.WD[k]; if (ws == null || wd == null) continue; tot++; if (ws * Math.abs(Math.sin((wd - H) * D2R)) <= lm) ok++; }
  return (RWY_CACHE[key] = tot ? ok / tot * 100 : 0);
}
function bestRunway() {
  busy(true, "Probando 180 rumbos…");
  setTimeout(() => {
    const c = S.climate, lm = S.runway.limit / 1.94384; let best = 0, bs = -Infinity, bv = 0;
    for (let H = 0; H < 180; H++) {
      let ok = 0, tot = 0, cross = 0;
      for (let k = 0; k < c.WS.length; k++) { const ws = c.WS[k], wd = c.WD[k]; if (ws == null || wd == null) continue; tot++; const x = ws * Math.abs(Math.sin((wd - H) * D2R)); cross += x; if (x <= lm) ok++; }

      if (score > bs) { bs = score; best = H; bv = cov; }
    }
    busy(false); S.runway.heading = best; saveLocal(); renderPanel(); render(); toast("Mejor rumbo: " + best + "°/" + (best + 180) + "° · " + fmt(bv, 2) + "%");

}

  const H3=3.2; // altura por nivel (m)
  const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;};
  const toPts=p=>p.map(q=>({x:+q[0],y:+q[1]}));
  const sigOf=(pts,h)=>pts.map(p=>(+p.x).toFixed(2)+','+(+p.y).toFixed(2)).join(';')+'|'+(+h||0).toFixed(2);
  const isMz=v=>String(v&&v.id).startsWith('mz_');
  const proj=()=>{ try{ return B&&B.project?B.project():null; }catch(e){ return null; } };
  const mzState=()=>{ if(!S.mz||typeof S.mz!=='object') S.mz={}; S.mz.del=S.mz.del||[]; S.mz.bus=S.mz.bus||{}; S.mz.sent=S.mz.sent||{}; return S.mz; };
  const PROF=[[/aeropuert|aerodr/i,'aeropuerto'],[/salud|hospital|cl[ií]nic|pedi[aá]tr|m[eé]dic/i,'hospital'],[/hotel|hosped/i,'hotel'],[/educa|escuela|colegio|universi|guarder/i,'educacion'],[/vivienda|residen|casa|departamento/i,'vivienda'],[/oficina|comerc|corporat/i,'oficinas'],[/urban|plan maestro|barrio/i,'urbanismo'],[/equipam|cultur|deport|mercado|terminal|religio/i,'equipamiento']];

  /* ---------- datos base del proyecto (la fuente es DION) ---------- */
  function lotFrom(p){
    const t=p&&p.terreno; if(!t||!Array.isArray(t.local)||t.local.length<3) return null;
    // mismo origen que el terreno del bus (centro de los vértices), así las zonas de M.E.Z. calzan
    const L=t.local, cx=L.reduce((a,q)=>a+(+q[0]),0)/L.length, cy=L.reduce((a,q)=>a+(+q[1]),0)/L.length;
    return L.map(([x,y])=>({x:+(x-cx).toFixed(2),y:+(y-cy).toFixed(2)}));
  }
  function applyProjectBase(p,force){
    if(!p) return false; let ch=false; S.dion=S.dion||{};
    if(p.nombre&&S.name!==p.nombre){ S.name=p.nombre; ch=true; }
    const loc=p.loc||{}, lat=parseFloat(loc.lat), lon=parseFloat(loc.lon);
    if(isFinite(lat)&&isFinite(lon)&&(S.site.lat!==lat||S.site.lon!==lon)){ S.site.lat=lat; S.site.lon=lon; ch=true; }
    const tz=/gal[aá]pagos/i.test(loc.provincia||'')||p.tz==='Pacific/Galapagos'?-6:-5;
    if(S.site.tz!==tz){ S.site.tz=tz; ch=true; }
    const place=[loc.parroquia,loc.canton,loc.provincia,loc.pais].filter(Boolean).join(', ');
    if(place&&S.site.place!==place){ S.site.place=place; ch=true; }
    const tp=[p.tipo,p.tipoN,p.cat].filter(Boolean).join(' ');
    if(tp&&(S.profile==='otro'||S.dion.profAuto)){ const m=PROF.find(r=>r[0].test(tp)); if(m&&S.profile!==m[1]){ S.profile=m[1]; S.dion.profAuto=1; ch=true; } }
    const lot=lotFrom(p);
    if(lot){ const th=hash(JSON.stringify(p.terreno.local)); if(force||th!==S.dion.tHash||!S.lot.length){ S.lot=lot; S.scaled=true; S.dion.tHash=th; ch=true; } }
    S.dion.id=p.id; S.dion.codigo=p.codigo||''; S.dion.norm=p.norm||null; S.dion.area=p.terreno?+p.terreno.area||0:0;
    return ch;
  }

  /* ---------- zonificación de M.E.Z. → volúmenes 'mz_<id>' ---------- */
  function zonasForMe(){
    const all=BUS.read(), z=all.zonas; if(!z||!Array.isArray(z.items)) return null;
    if(PID){ const owner=z.dion||z.proyecto||(all.terreno&&all.terreno.dion)||null; if(owner&&owner!==PID) return null; }
    return z.items.filter(i=>i&&i.id!=null&&Array.isArray(i.poly)&&i.poly.length>=3);
  }
  const zoneH=i=>(+i.h>0)?+i.h:Math.max(1,+i.niveles||1)*H3;
  function syncZonas(force){
    const items=zonasForMe(); const M=mzState(); let ch=false;
    const n0=S.vols.length; S.vols=S.vols.filter(v=>!String(v.id).startsWith('mp_')); if(S.vols.length!==n0) ch=true; // restos del master plan anterior
    if(!items) return ch;
    if(force){ M.del=[]; M.bus={}; }
    const del=new Set(M.del), ids=new Set();
    for(const i of items){
      const id='mz_'+i.id; ids.add(id); if(del.has(id)) continue;
      const pts=toPts(i.poly), h=zoneH(i);
      const meta={zid:String(i.id),code:i.code||'',zname:i.name||'',m2:+i.m2||Math.round(polyArea(pts)),niveles:+i.niveles||Math.max(1,Math.round(h/H3)),color:i.color||'#38E1FF',z0:+i.z0||0};
      const bsig=sigOf(pts,h)+'|'+JSON.stringify(meta);
      let v=S.vols.find(q=>q.id===id);
      if(!v){ v={id,name:((meta.code?meta.code+' ':'')+(meta.zname||'Zona')).slice(0,30),pts,h,kind:'propuesto',mz:meta}; S.vols.push(v); ch=true; }
      else if(M.bus[id]!==bsig){ v.pts=pts; v.h=h; v.name=((meta.code?meta.code+' ':'')+(meta.zname||'Zona')).slice(0,30); v.mz=meta; ch=true; }
      M.bus[id]=bsig; M.sent[id]=sigOf(v.pts,v.h);
    }
    S.vols=S.vols.filter(v=>{ if(!isMz(v)||ids.has(v.id)) return true; ch=true; delete M.bus[v.id]; delete M.sent[v.id]; return false; });
    if(ch&&typeof SEL!=='undefined'&&SEL&&SEL.type==='vol'&&!S.vols.some(v=>v.id===SEL.id)) SEL=null;
    return ch;
  }
  // A.S. → M.E.Z.: solo lo que cambió desde la última sincronización (sin bucles)
  function pushMoves(){
    if(applying) return; const M=mzState(), items=[];
    for(const v of S.vols){ if(!isMz(v)||!v.pts||v.pts.length<3) continue; const sg=sigOf(v.pts,v.h); if(M.sent[v.id]===sg) continue; M.sent[v.id]=sg;
      const niv=Math.max(1,Math.round((+v.h||H3)/H3)); if(v.mz) v.mz.niveles=niv;
      items.push({id:v.mz?v.mz.zid:v.id.slice(3),poly:v.pts.map(p=>[+(+p.x).toFixed(2),+(+p.y).toFixed(2)]),h:+(+v.h).toFixed(2),niveles:niv}); }
    if(items.length) BUS.write('zonasMove',{items,from:'as',t:Date.now()},'as');
  }
  window.__asDragHook=h=>{ const ok=h&&((h.type==='vol'&&isMz(h.o))||(h.kind==='vert'&&h.arr!==S.lot&&SEL&&SEL.type==='vol'&&String(SEL.id).startsWith('mz_'))); if(!ok||dragT) return; dragT=setTimeout(()=>{ dragT=0; pushMoves(); },180); };

  /* ---------- guardar / cargar por proyecto ---------- */
  function packState(){ const {climate,...rest}=S; let bg=BG_SRC||null; if(bg&&bg.length>2.5e6) bg=null; return {v:1,savedAt:S.savedAt||Date.now(),S:JSON.parse(JSON.stringify(rest)),climate:climate?packClimate(climate):null,bg}; }
  function flushLocal(){ try{ clearTimeout(saveLocal._t); const {climate,...rest}=S; localStorage.setItem(STORE_KEY,JSON.stringify(rest)); }catch(e){} }
  function saveDion(now){
    if(!B||!PID||!ready) return; clearTimeout(bTimer);
    const go=()=>{ bTimer=0; const p=proj(); if(!p||p.id!==PID) return; try{ Promise.resolve(B.save('as',packState())).catch(e=>console.warn('A.S. → DION',e)); }catch(e){ console.warn('A.S. → DION',e); } };
    if(now) go(); else bTimer=setTimeout(go,1000);
  }
  function restore(st){
    S=mergeState(st.S||{}); S.climate=st.climate||null; climReset(); SEL=null; UNDO.length=0; REDO.length=0;
    BG_SRC=null; BG_IMG=null; if(st.bg) setBgSrc(st.bg,true);
    try{ saveClimateLocal(); saveBgLocal(); }catch(e){}
  }
  function refreshUI(fit){
    try{ climReset(); invalidate(); buildTools(); buildNav(); syncTimeBar(); updateBadge(); }catch(e){ console.warn(e); }
    $("#panel").classList.toggle("hide",!!S.ui.panelHidden); $("#work").classList.toggle("panelHidden",!!S.ui.panelHidden);
    if(S.ui.secOpen&&S.sections.some(s=>s.id===S.ui.secOpen)) openSection(S.ui.secOpen); else { S.ui.secOpen=null; $("#secView").hidden=true; }
    if(S.ui.view==='3d') setView('3d'); else { setView('2d'); }
    if(fit) fitView(); renderPanel(); render(); ensureWindAnim(); windSetup(true);
  }
  async function start(){
    const p=proj(); ready=false;
    const localAt=+S.savedAt||0;
    applying=true; try{ applyProjectBase(p); syncZonas(false); }catch(e){ console.warn(e); } applying=false;
    refreshUI(true);
    let st=null; try{ st=await B.load('as'); }catch(e){ console.warn('A.S. ← DION',e); }
    const cur=proj(); if(!cur||cur.id!==PID) return; // cambió de proyecto mientras cargaba
    applying=true;
    try{
      if(st&&st.S&&(+st.savedAt||0)>=localAt){ restore(st); applyProjectBase(cur); syncZonas(false); refreshUI(true); }
      ['zonas','terreno','tiempo','sync'].forEach(k=>BUS.seen(k));
    }catch(e){ console.warn('A.S. restaurar',e); }
    applying=false; ready=true;
    saveLocal(); // respaldo local + DION con el estado ya armado
  }
  function switchProject(p){
    flushLocal(); clearTimeout(bTimer); bTimer=0;
    PID=p.id; DION_P=p; setStoreKeys(PID);
    S=blankState(); BG_SRC=null; BG_IMG=null; SEL=null; UNDO.length=0; REDO.length=0; climReset();
    loadLocal(); start();
  }

  /* ---------- bus en vivo ---------- */
  function apply(first,forced){
    if(B&&PID&&!ready&&!forced) return;
    applying=true;
    try{
      let any=false, fit=false;
      const t=first?BUS.get('terreno'):BUS.changed('terreno');
      if(t&&t.poly){
        if(B&&PID){ if(t.dion===PID){ const p=proj(); if(p&&applyProjectBase(p)){ any=true; fit=true; } } }
        else if(forced||!S.lot.length||!first){ S.lot=toPts(t.poly); S.site={...S.site,lat:+t.lat||S.site.lat,lon:+t.lon||S.site.lon,tz:t.tz!=null?+t.tz:S.site.tz,north:+t.north||0}; S.scaled=true; if(t.proyecto) S.name=String(t.proyecto); any=true; fit=true; }
      }
      const z=first?BUS.get('zonas'):BUS.changed('zonas');
      if(z||first||forced){ if(syncZonas(!!forced)) any=true; }
      const tm=first?BUS.get('tiempo'):BUS.changed('tiempo');
      if(tm&&(tm.m!==S.time.m||tm.d!==S.time.d||Math.abs(tm.h-S.time.h)>1e-6)){ S.time={m:+tm.m,d:+tm.d,h:+tm.h}; if(typeof timeChanged==='function') timeChanged(false); }
      if(first) ['terreno','zonas','tiempo','clima','sync'].forEach(p=>BUS.seen(p));
      if(any){ invalidate(); updateBadge(); if(fit) try{ fitView(); }catch(e){} render(); renderPanel(); applying=false; saveLocal(); }
    }catch(e){ console.warn('puente A.S.',e); }
    applying=false;
  }
  function force(){ apply(true,true); try{ toast('✓ Zonificación de M.E.Z. cargada ('+S.vols.filter(isMz).length+' volúmenes)'); }catch(e){} }
  window.__asMez=force;
  window.__nhigSync=force;

  function roseOf(c){
    if(!c||!c.WS||!c.WD) return null; const bins=new Array(16).fill(0); let calm=0,n=0,sw=0;
    for(let i=0;i<c.WS.length;i++){ const s=c.WS[i],d=c.WD[i]; if(s==null||d==null) continue; n++; sw+=s; if(s<0.5){calm++;continue;} bins[Math.round(((d%360)+360)%360/22.5)%16]++; }
    if(!n) return null; return {label:c.label||'clima',rose:bins.map(b=>+(b/n*100).toFixed(2)),calm:+(calm/n*100).toFixed(2),ws:+(sw/n).toFixed(2)};
  }

  /* ---------- enganches con el núcleo ---------- */
  const _save=window.saveLocal;
  window.saveLocal=function(){ S.savedAt=Date.now(); _save.apply(this,arguments); if(applying) return; BUS.write('tiempo',{m:S.time.m,d:S.time.d,h:S.time.h},'as'); pushMoves(); saveDion(); };
  const _del=window.deleteSel;
  window.deleteSel=function(){ try{ if(SEL&&SEL.type==='vol'&&String(SEL.id).startsWith('mz_')){ const M=mzState(); if(!M.del.includes(SEL.id)) M.del.push(SEL.id); } }catch(e){} return _del.apply(this,arguments); };
  const _np=window.doNewProject;
  window.doNewProject=function(){
    if(!(B&&PID)) return _np.apply(this,arguments);
    pushUndo(); const site={...S.site}; S=blankState(); S.site=site; BG_SRC=null; BG_IMG=null; climReset(); SEL=null;
    const M=mzState(); applying=true; applyProjectBase(proj(),true); M.del=(zonasForMe()||[]).map(i=>'mz_'+i.id); applying=false; // vacía también las zonas (vuelven con «Cargar zonificación de M.E.Z.»)
    saveBgLocal(); saveClimateLocal(); closeModal(); refreshUI(true); saveLocal(); toast('Sitio vaciado · terreno y ubicación siguen viniendo de DION');
  };
  const _os=window.openSettings;
  window.openSettings=function(){ _os.apply(this,arguments); if(B&&PID){ const c=$("#modalCard"), n=document.createElement('p'); n.className='note'; n.innerHTML='<span class="mzTag">DION</span> Nombre, ubicación y terreno vienen del proyecto activo de DION. Puedes ajustarlos aquí; si cambian en DION se vuelven a tomar de allá.'; const h=c.querySelector('h3'); if(h) h.after(n); } };
  const _clim=window.saveClimateLocal;
  window.saveClimateLocal=function(){ _clim.apply(this,arguments); const r=roseOf(S.climate); if(r) BUS.write('clima',r,'as'); };
  const _tc=window.timeChanged;
  window.timeChanged=function(full){ _tc.apply(this,arguments); if(!applying) BUS.write('tiempo',{m:S.time.m,d:S.time.d,h:S.time.h},'as'); };

  // ficha del proyecto de DION y de la zonificación de M.E.Z. en la sección Base
  const fm=(v,n)=>v==null||v===''||!isFinite(+v)?'–':(+v).toFixed(n==null?2:n).replace(/\.?0+$/,'');
  function dionBox(){
    const mz=S.vols.filter(isMz), d=S.dion||{}, N=d.norm||null;
    let h='';
    if(B&&PID) h+=`<details class="box" open><summary>${icon('map')} Proyecto DION</summary><div class="bd">
      <div class="row" style="justify-content:space-between"><b style="font-size:13px">${esc(S.name)}</b><span class="mzTag">${esc(d.codigo||'activo')}</span></div>
      <div class="kv"><dt>Ubicación</dt><dd style="font-family:var(--f-b)">${esc(S.site.place||'–')}</dd><dt>Lat / lon</dt><dd>${fmt(S.site.lat,4)} / ${fmt(S.site.lon,4)}</dd><dt>Huso</dt><dd>UTC${S.site.tz>=0?'+':''}${S.site.tz}</dd><dt>Terreno</dt><dd>${S.lot.length>=3?fmt(polyArea(S.lot),1)+' m²':'sin trazar en DION'}</dd></div>
      ${N?`<div class="kv" style="margin-top:6px"><dt>COS / CUS</dt><dd>${fm(N.cos)} / ${fm(N.cus)}</dd><dt>Pisos / altura máx.</dt><dd>${fm(N.pisos,0)} / ${fm(N.altura,1)} m</dd><dt>Retiros F · L · P</dt><dd>${fm(N.retF,1)} · ${fm(N.retL,1)} · ${fm(N.retP,1)} m</dd></div>`:''}
      <p class="note" style="margin:6px 0 0">Datos base leídos de DION: no hace falta volver a escribirlos.</p></div></details>`;
    h+=`<details class="box" open><summary>${icon('layers')} Zonificación M.E.Z. (${mz.length})</summary><div class="bd">
      ${mz.length?mz.map(v=>`<div class="list-item ${SEL&&SEL.id===v.id?'sel':''}" onclick="SEL={type:'vol',id:'${v.id}'};renderPanel();render()"><span class="sw" style="background:${esc(v.mz&&v.mz.color||'#38E1FF')}"></span><span class="grow">${esc((v.mz&&v.mz.code?v.mz.code+' · ':'')+(v.mz?v.mz.zname:v.name))}</span><span class="pill">${fmt(polyArea(v.pts),0)} m²</span><span class="pill">${v.mz?v.mz.niveles:Math.round(v.h/H3)} niv</span></div>`).join(''):`<p class="note">Aún no hay zonas. Zonifica en M.E.Z. y aparecerán aquí como volúmenes, en vivo.</p>`}
      <div class="row"><button class="btn sm pri" onclick="__asMez()">${icon('layers')}Cargar zonificación de M.E.Z.</button>${B?`<button class="btn sm ghost" onclick="try{DIONB.open('mez')}catch(e){}">Abrir M.E.Z.</button>`:''}</div>
      <p class="note" style="margin:4px 0 0">Mueve, cambia la forma o la altura de un volumen de zona aquí y M.E.Z. lo refleja.</p></div></details>`;
    return h;
  }
  try{ const _bp=SECTIONS.base.panel; SECTIONS.base.panel=function(){ return dionBox()+_bp.apply(this,arguments); }; }catch(e){}

  /* ---------- escuchas ---------- */
  BUS.on(()=>{ if(BUS.changed('sync')) force(); else apply(false); });
  window.addEventListener('message',e=>{ const d=e.data; if(!d||d.nhig!=='bus') return; if(d.from==='as') return;
    if(d.part==='sync'){ if(BUS.changed('sync')) force(); return; }
    apply(false); });
  if(B&&B.on){ try{ B.on(p=>{ if(!p) return; if(p.id!==PID) switchProject(p); else { applying=true; const ch=applyProjectBase(p); applying=false; if(ch){ invalidate(); updateBadge(); fitView(); renderPanel(); render(); saveLocal(); } } }); }catch(e){ console.warn(e); } }
  window.addEventListener('pagehide',()=>{ flushLocal(); if(bTimer) saveDion(true); });

  /* ---------- arranque ---------- */
  if(B&&PID){ start(); }
  else { apply(true); const r0=roseOf(S.climate); if(r0) BUS.write('clima',r0,'as'); }
  BUS.seen('sync');
})();
</script></body></html>
